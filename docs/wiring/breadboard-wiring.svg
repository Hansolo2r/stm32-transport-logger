<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
  <defs>
    <pattern id="holes" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="5" fill="#9aa3aa"/>
      <circle cx="17" cy="17" r="2.5" fill="#32383d"/>
    </pattern>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172027; letter-spacing: 0; }
      .title { font-size: 48px; font-weight: 700; }
      .subtitle { font-size: 25px; fill: #53616b; }
      .section { font-size: 32px; font-weight: 700; }
      .module-title { font-size: 25px; font-weight: 700; }
      .module-text { font-size: 20px; }
      .small { font-size: 18px; fill: #4d5a63; }
      .pin { font-size: 20px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #aeb8bf; stroke-width: 3; rx: 8; }
      .module { stroke: #3f4b53; stroke-width: 3; rx: 7; }
      .wire-power { stroke: #d33b36; fill: none; stroke-width: 8; }
      .wire-ground { stroke: #20272c; fill: none; stroke-width: 8; }
      .wire-i2c { stroke: #16866e; fill: none; stroke-width: 7; }
      .wire-spi { stroke: #d97917; fill: none; stroke-width: 7; }
      .wire-uart { stroke: #2676c7; fill: none; stroke-width: 7; }
      .wire-gpio { stroke: #7652a8; fill: none; stroke-width: 7; }
    </style>
  </defs>

  <rect width="2400" height="1800" fill="#f5f7f8"/>
  <text x="70" y="70" class="title">STM32F103C8T6 温度与运动记录器：830孔面包板安装与接线图</text>
  <text x="70" y="112" class="subtitle">适用于当前固件：DS18B20 PA8 / OLED PB8-PB9 / ADXL345 PB10-PB11 / W25Q64 PB12-PB15 / DS1302 PA4-PA6 / JDY-16 PA2-PA3</text>

  <rect x="45" y="145" width="2310" height="820" class="box"/>
  <text x="75" y="195" class="section">A. 元件在面包板上的推荐位置（俯视）</text>

  <rect x="85" y="225" width="2230" height="690" rx="8" fill="#fafafa" stroke="#a7afb5" stroke-width="4"/>
  <rect x="130" y="300" width="2140" height="165" fill="url(#holes)" opacity="0.55"/>
  <rect x="130" y="525" width="2140" height="165" fill="url(#holes)" opacity="0.55"/>
  <rect x="130" y="465" width="2140" height="60" fill="#dfe4e7"/>
  <text x="1090" y="503" class="small">中央沟槽：上下两侧不导通</text>

  <line x1="125" y1="255" x2="1160" y2="255" class="wire-ground"/>
  <line x1="1240" y1="255" x2="2275" y2="255" class="wire-ground"/>
  <line x1="125" y1="280" x2="1160" y2="280" class="wire-power"/>
  <line x1="1240" y1="280" x2="2275" y2="280" class="wire-power"/>
  <line x1="125" y1="860" x2="1160" y2="860" class="wire-ground"/>
  <line x1="1240" y1="860" x2="2275" y2="860" class="wire-ground"/>
  <line x1="125" y1="885" x2="1160" y2="885" class="wire-power"/>
  <line x1="1240" y1="885" x2="2275" y2="885" class="wire-power"/>

  <path d="M1160 255 C1180 220,1220 220,1240 255" class="wire-ground"/>
  <path d="M1160 280 C1180 320,1220 320,1240 280" class="wire-power"/>
  <text x="1040" y="240" class="pin">必须跨接中断点</text>

  <rect x="180" y="335" width="610" height="330" class="module" fill="#dfe7ec"/>
  <text x="485" y="405" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">STM32F103C8T6 核心板</text>
  <text x="485" y="450" text-anchor="middle" font-size="22" fill="#e6edf1">横跨中央沟槽，元件面和丝印朝上</text>
  <text x="485" y="492" text-anchor="middle" font-size="22" fill="#e6edf1">两排长针分别插入 A 行与 J 行</text>
  <text x="485" y="548" text-anchor="middle" font-size="20" fill="#9fe0cf">左侧保留 Reset / SWD 调试空间</text>
  <text x="485" y="590" text-anchor="middle" font-size="20" fill="#9fe0cf">同编号其余四孔用于接杜邦线</text>
  <circle cx="210" cy="365" r="11" fill="#f0c53d"/><circle cx="760" cy="365" r="11" fill="#f0c53d"/>
  <circle cx="210" cy="635" r="11" fill="#f0c53d"/><circle cx="760" cy="635" r="11" fill="#f0c53d"/>

  <rect x="845" y="335" width="245" height="160" class="module" fill="#dcebf6"/>
  <text x="968" y="385" text-anchor="middle" class="module-title" fill="#ffffff">W25Q64</text>
  <text x="968" y="423" text-anchor="middle" class="module-text" fill="#ffffff">靠近 PB12-PB15</text>
  <text x="968" y="457" text-anchor="middle" class="small" fill="#dcebf5">SPI线尽量短</text>

  <rect x="1125" y="335" width="245" height="150" class="module" fill="#dff1f4"/>
  <text x="1248" y="383" text-anchor="middle" class="module-title" fill="#ffffff">DS18B20</text>
  <text x="1248" y="420" text-anchor="middle" class="module-text" fill="#ffffff">探头/传感器朝外</text>
  <text x="1248" y="452" text-anchor="middle" class="small" fill="#dcebf5">模块固定在边缘</text>

  <rect x="1410" y="335" width="280" height="195" class="module" fill="#dceaf3"/>
  <text x="1550" y="382" text-anchor="middle" class="module-title" fill="#ffffff">ADXL345</text>
  <text x="1550" y="420" text-anchor="middle" class="module-text" fill="#ffffff">平放并刚性固定</text>
  <text x="1550" y="456" text-anchor="middle" class="small" fill="#dcebf5">X/Y箭头与外壳方向对齐</text>
  <text x="1550" y="492" text-anchor="middle" class="small" fill="#dcebf5">不能悬挂在线上</text>

  <rect x="1750" y="325" width="465" height="220" class="module" fill="#dff0e4"/>
  <text x="1983" y="375" text-anchor="middle" class="module-title" fill="#ffffff">DS1302 RTC</text>
  <circle cx="2075" cy="445" r="70" fill="#d8dde0" stroke="#737d84" stroke-width="5"/>
  <text x="2075" y="454" text-anchor="middle" font-size="20">CR2032 +朝上</text>
  <text x="1875" y="425" text-anchor="middle" class="module-text" fill="#ffffff">放在边缘</text>
  <text x="1875" y="465" text-anchor="middle" class="small" fill="#dfeee4">方便更换电池</text>
  <text x="1875" y="500" text-anchor="middle" class="small" fill="#dfeee4">确认不再发热</text>

  <rect x="870" y="650" width="510" height="155" class="module" fill="#e7ecef"/>
  <text x="1125" y="700" text-anchor="middle" class="module-title" fill="#ffffff">SSD1306 OLED</text>
  <text x="1125" y="742" text-anchor="middle" class="module-text" fill="#ffffff">屏幕朝外，放在外壳观察窗口一侧</text>
  <text x="1125" y="778" text-anchor="middle" class="small" fill="#dce5ea">用短线连接；不要让屏幕受力</text>

  <rect x="1790" y="665" width="390" height="150" class="module" fill="#ddf0ea"/>
  <text x="1985" y="712" text-anchor="middle" class="module-title" fill="#ffffff">JDY-16 BLE</text>
  <text x="1985" y="752" text-anchor="middle" class="module-text" fill="#ffffff">天线端朝外并留空</text>
  <text x="1985" y="786" text-anchor="middle" class="small" fill="#dff0ea">不要覆盖金属或电池</text>

  <text x="150" y="838" class="small">红轨 = 3.3V，蓝/黑轨 = GND。若使用下方电源轨，再分别从上方红轨和GND轨跨接到下方；严禁红黑交叉。</text>
  <text x="150" y="910" class="small">不能直接插入的模块用短杜邦线连接，并用可拆双面胶固定 PCB 边缘；第一版不要永久封胶。</text>

  <rect x="45" y="995" width="2310" height="750" class="box"/>
  <text x="75" y="1045" class="section">B. 准确引脚连接（按模块丝印接，不按杜邦线颜色猜测）</text>

  <rect x="865" y="1090" width="670" height="575" rx="8" fill="#dfe7ec" stroke="#4b5962" stroke-width="4"/>
  <text x="1200" y="1145" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">STM32F103C8T6</text>
  <text x="1200" y="1183" text-anchor="middle" font-size="20" fill="#cbd7de">当前 CubeMX / 固件引脚</text>

  <rect x="900" y="1215" width="285" height="405" rx="6" fill="#eef3f5"/>
  <text x="1042" y="1255" text-anchor="middle" class="module-title">PA 侧</text>
  <text x="925" y="1300" class="pin" fill="#2676c7">PA2  → JDY RXD</text>
  <text x="925" y="1342" class="pin" fill="#2676c7">PA3  ← JDY TXD</text>
  <text x="925" y="1392" class="pin" fill="#7652a8">PA4  → RTC CLK</text>
  <text x="925" y="1434" class="pin" fill="#7652a8">PA5  ↔ RTC DAT</text>
  <text x="925" y="1476" class="pin" fill="#7652a8">PA6  → RTC RST</text>
  <text x="925" y="1526" class="pin" fill="#7652a8">PA8  ↔ DS18 DQ</text>
  <text x="925" y="1576" class="small">PA9/PA10：有线串口</text>

  <rect x="1215" y="1215" width="285" height="405" rx="6" fill="#eef3f5"/>
  <text x="1358" y="1255" text-anchor="middle" class="module-title">PB 侧</text>
  <text x="1240" y="1300" class="pin" fill="#16866e">PB8  → OLED SCL</text>
  <text x="1240" y="1342" class="pin" fill="#16866e">PB9  ↔ OLED SDA</text>
  <text x="1240" y="1392" class="pin" fill="#16866e">PB10 → ADXL SCL</text>
  <text x="1240" y="1434" class="pin" fill="#16866e">PB11 ↔ ADXL SDA</text>
  <text x="1240" y="1484" class="pin" fill="#d97917">PB12 → Flash CS</text>
  <text x="1240" y="1526" class="pin" fill="#d97917">PB13 → Flash CLK</text>
  <text x="1240" y="1568" class="pin" fill="#d97917">PB14 ← Flash DO</text>
  <text x="1240" y="1610" class="pin" fill="#d97917">PB15 → Flash DI</text>

  <rect x="85" y="1100" width="690" height="150" class="module" fill="#eaf7f3"/>
  <text x="115" y="1142" class="module-title">SSD1306 OLED（模块丝印：GND VCC SCL SDA）</text>
  <text x="115" y="1185" class="module-text">GND → 公共GND　 VCC → 3.3V　 SCL → PB8　 SDA → PB9</text>
  <line x1="775" y1="1180" x2="865" y2="1300" class="wire-i2c"/>

  <rect x="85" y="1280" width="690" height="190" class="module" fill="#eaf7f3"/>
  <text x="115" y="1322" class="module-title">ADXL345（I2C模式）</text>
  <text x="115" y="1365" class="module-text">VCC → 3.3V　 GND → 公共GND　 SCL → PB10　 SDA → PB11</text>
  <text x="115" y="1407" class="module-text">CS → 3.3V　 SDO → GND（地址 0x53）</text>
  <text x="115" y="1445" class="small">INT1、INT2 不接；GND不能省略，SDO不能代替专用GND</text>
  <line x1="775" y1="1370" x2="865" y2="1420" class="wire-i2c"/>

  <rect x="85" y="1500" width="690" height="170" class="module" fill="#fff2e5"/>
  <text x="115" y="1542" class="module-title">W25Q64（模块丝印：VCC CS DO GND SCLK DI）</text>
  <text x="115" y="1585" class="module-text">VCC → 3.3V　 GND → GND　 CS → PB12　 SCLK → PB13</text>
  <text x="115" y="1627" class="module-text">DO → PB14（MISO）　 DI → PB15（MOSI）</text>
  <line x1="775" y1="1585" x2="865" y2="1530" class="wire-spi"/>

  <rect x="1625" y="1100" width="690" height="170" class="module" fill="#f1ebf8"/>
  <text x="1655" y="1142" class="module-title">DS1302 RTC（模块丝印：VCC GND CLK DAT RST）</text>
  <text x="1655" y="1185" class="module-text">VCC → 3.3V　 GND → 公共GND　 CLK → PA4</text>
  <text x="1655" y="1227" class="module-text">DAT → PA5　 RST → PA6　 CR2032 正极朝上</text>
  <line x1="1535" y1="1415" x2="1625" y2="1185" class="wire-gpio"/>

  <rect x="1625" y="1300" width="690" height="150" class="module" fill="#f1ebf8"/>
  <text x="1655" y="1342" class="module-title">DS18B20 模块（丝印：VCC DQ GND）</text>
  <text x="1655" y="1385" class="module-text">VCC → 3.3V　 DQ → PA8　 GND → 公共GND</text>
  <text x="1655" y="1422" class="small">使用已购买的模块板，不再另接外部上拉电阻</text>
  <line x1="1535" y1="1495" x2="1625" y2="1380" class="wire-gpio"/>

  <rect x="1625" y="1480" width="690" height="180" class="module" fill="#e8f1fb"/>
  <text x="1655" y="1522" class="module-title">JDY-16 BLE（UART交叉连接）</text>
  <text x="1655" y="1565" class="module-text">VCC → 3.3V　 GND → 公共GND</text>
  <text x="1655" y="1607" class="module-text">TXD → PA3（STM32 RX）　 RXD → PA2（STM32 TX）</text>
  <text x="1655" y="1643" class="small">蓝牙波特率 9600；天线端不要紧贴电池或金属外壳</text>
  <line x1="1535" y1="1320" x2="1625" y2="1570" class="wire-uart"/>

  <rect x="80" y="1692" width="2240" height="36" rx="6" fill="#fff3cd" stroke="#d8ad38" stroke-width="2"/>
  <text x="1200" y="1718" text-anchor="middle" font-size="20" font-weight="700">第一次迁移必须断电操作：先接电源轨和STM32，再按 OLED → W25Q64 → DS18B20 → ADXL345 → DS1302 → JDY-16 的顺序逐个通电验证。</text>

  <g transform="translate(75,1750)">
    <line x1="0" y1="0" x2="60" y2="0" class="wire-power"/><text x="72" y="7" class="small">3.3V</text>
    <line x1="180" y1="0" x2="240" y2="0" class="wire-ground"/><text x="252" y="7" class="small">GND</text>
    <line x1="355" y1="0" x2="415" y2="0" class="wire-i2c"/><text x="427" y="7" class="small">I2C</text>
    <line x1="535" y1="0" x2="595" y2="0" class="wire-spi"/><text x="607" y="7" class="small">SPI</text>
    <line x1="710" y1="0" x2="770" y2="0" class="wire-uart"/><text x="782" y="7" class="small">UART</text>
    <line x1="900" y1="0" x2="960" y2="0" class="wire-gpio"/><text x="972" y="7" class="small">RTC / 单总线GPIO</text>
    <text x="1460" y="7" class="small">ST-Link与UST-343A作为外部调试工具，不固定进外壳。</text>
  </g>
</svg>
