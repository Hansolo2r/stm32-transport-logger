<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2"/></filter>
    <style>
      text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#172026;letter-spacing:0}.title{font-size:38px;font-weight:700}.subtitle{font-size:20px;fill:#4b5860}
      .card{stroke-width:3;filter:url(#shadow)}.ct{font-size:25px;font-weight:700;fill:#fff}.cn{font-size:17px;fill:#fff}.pin{font-size:18px;font-weight:700}.small{font-size:15px}.section{font-size:24px;font-weight:700}.white{fill:#fff}
      .yellow{stroke:#d5a400;stroke-width:7;fill:none}.green{stroke:#25845b;stroke-width:7;fill:none}.purple{stroke:#7953a5;stroke-width:7;fill:none}.blue{stroke:#2d79aa;stroke-width:7;fill:none}.cyan{stroke:#1a96a5;stroke-width:7;fill:none}.orange{stroke:#d36d20;stroke-width:7;fill:none}
      .dotY{fill:#d5a400}.dotG{fill:#25845b}.dotP{fill:#7953a5}.dotBl{fill:#2d79aa}.dotC{fill:#1a96a5}.dotO{fill:#d36d20}
    </style>
  </defs>
  <rect width="1800" height="1400" fill="#f5f7f8"/>
  <text x="70" y="62" class="title">最终信号接线图：每个模块逐根连接</text>
  <text x="70" y="100" class="subtitle">所有模块同时连接 VCC→3.3V红轨、GND→黑轨；下图只展开信号线。先断电接线，再上电测试。</text>

  <!-- Power reminder -->
  <rect x="70" y="125" width="1660" height="65" rx="9" fill="#fff" stroke="#aab3b8" stroke-width="2"/>
  <line x1="105" y1="149" x2="235" y2="149" stroke="#d63f3f" stroke-width="8"/><text x="255" y="157" class="pin">VCC全部接3.3V红轨</text>
  <line x1="580" y1="149" x2="710" y2="149" stroke="#222" stroke-width="8"/><text x="730" y="157" class="pin">GND全部接黑轨</text>
  <text x="1130" y="157" class="pin" fill="#9b2a22">不要把任何模块VCC接到5V</text>

  <!-- STM32 center -->
  <rect class="card" x="680" y="220" width="440" height="780" rx="15" fill="#252b2f" stroke="#111619"/>
  <text x="900" y="270" text-anchor="middle" class="ct">STM32F103C8T6</text>
  <text x="900" y="303" text-anchor="middle" class="cn">当前 project 1.ioc 的真实引脚</text>
  <line x1="700" y1="325" x2="1100" y2="325" stroke="#66737a" stroke-width="2"/>

  <!-- left pins -->
  <circle cx="700" cy="365" r="11" class="dotG"/><text x="730" y="372" class="pin white">PA8　DS18B20_DQ</text>
  <circle cx="700" cy="455" r="11" class="dotY"/><text x="730" y="462" class="pin white">PB8　I2C1_SCL</text>
  <circle cx="700" cy="505" r="11" class="dotG"/><text x="730" y="512" class="pin white">PB9　I2C1_SDA</text>
  <circle cx="700" cy="625" r="11" class="dotY"/><text x="730" y="632" class="pin white">PB10　I2C2_SCL</text>
  <circle cx="700" cy="675" r="11" class="dotG"/><text x="730" y="682" class="pin white">PB11　I2C2_SDA</text>
  <circle cx="700" cy="735" r="11" fill="#d63f3f"/><text x="730" y="742" class="pin white">3.3V　ADXL345 CS</text>
  <circle cx="700" cy="785" r="11" fill="#111" stroke="#fff" stroke-width="2"/><text x="730" y="792" class="pin white">GND　ADXL345 SDO</text>

  <!-- right pins -->
  <circle cx="1100" cy="365" r="11" class="dotP"/><text x="1070" y="372" text-anchor="end" class="pin white">FLASH_CS　PB12</text>
  <circle cx="1100" cy="415" r="11" class="dotY"/><text x="1070" y="422" text-anchor="end" class="pin white">SPI2_SCK　PB13</text>
  <circle cx="1100" cy="465" r="11" class="dotBl"/><text x="1070" y="472" text-anchor="end" class="pin white">SPI2_MISO　PB14</text>
  <circle cx="1100" cy="515" r="11" class="dotG"/><text x="1070" y="522" text-anchor="end" class="pin white">SPI2_MOSI　PB15</text>
  <circle cx="1100" cy="615" r="11" class="dotY"/><text x="1070" y="622" text-anchor="end" class="pin white">RTC_CLK　PA4</text>
  <circle cx="1100" cy="665" r="11" class="dotG"/><text x="1070" y="672" text-anchor="end" class="pin white">RTC_DAT　PA5</text>
  <circle cx="1100" cy="715" r="11" class="dotP"/><text x="1070" y="722" text-anchor="end" class="pin white">RTC_RST　PA6</text>
  <circle cx="1100" cy="835" r="11" class="dotBl"/><text x="1070" y="842" text-anchor="end" class="pin white">USART2_TX　PA2</text>
  <circle cx="1100" cy="885" r="11" class="dotC"/><text x="1070" y="892" text-anchor="end" class="pin white">USART2_RX　PA3</text>
  <text x="900" y="960" text-anchor="middle" class="cn">PC13状态灯为板载LED，不需要外接</text>

  <!-- Left modules -->
  <rect class="card" x="70" y="260" width="410" height="170" rx="12" fill="#247a91" stroke="#15586b"/>
  <text x="275" y="305" text-anchor="middle" class="ct">DS18B20</text>
  <text x="105" y="351" class="pin white">DQ</text><circle cx="455" cy="365" r="11" class="dotG"/>
  <text x="275" y="400" text-anchor="middle" class="cn">VCC→3.3V，GND→GND</text>
  <path d="M466 365 H689" class="green"/><text x="565" y="351" text-anchor="middle" class="small">DQ → PA8</text>

  <rect class="card" x="70" y="455" width="410" height="180" rx="12" fill="#135d78" stroke="#0b4257"/>
  <text x="275" y="497" text-anchor="middle" class="ct">SSD1306 OLED</text>
  <text x="105" y="545" class="pin white">SCL</text><circle cx="455" cy="535" r="11" class="dotY"/>
  <text x="105" y="590" class="pin white">SDA</text><circle cx="455" cy="585" r="11" class="dotG"/>
  <text x="275" y="620" text-anchor="middle" class="cn">VCC→3.3V，GND→GND</text>
  <path d="M466 535 H565 V455 H689" class="yellow"/><text x="555" y="441" text-anchor="middle" class="small">SCL → PB8</text>
  <path d="M466 585 H595 V505 H689" class="green"/><text x="590" y="570" class="small">SDA → PB9</text>

  <rect class="card" x="70" y="680" width="410" height="270" rx="12" fill="#34758c" stroke="#175a6d"/>
  <text x="275" y="723" text-anchor="middle" class="ct">ADXL345（地址0x53）</text>
  <text x="105" y="770" class="pin white">SCL</text><circle cx="455" cy="760" r="11" class="dotY"/>
  <text x="105" y="815" class="pin white">SDA</text><circle cx="455" cy="805" r="11" class="dotG"/>
  <text x="105" y="860" class="pin white">CS</text><circle cx="455" cy="850" r="11" fill="#d63f3f"/>
  <text x="105" y="905" class="pin white">SDO</text><circle cx="455" cy="895" r="11" fill="#111" stroke="#fff" stroke-width="2"/>
  <text x="275" y="935" text-anchor="middle" class="cn">VCC→3.3V，GND必须单独接地</text>
  <path d="M466 760 H540 V625 H689" class="yellow"/><text x="530" y="611" class="small">SCL → PB10</text>
  <path d="M466 805 H570 V675 H689" class="green"/><text x="560" y="793" class="small">SDA → PB11</text>
  <path d="M466 850 H600 V735 H689" stroke="#d63f3f" stroke-width="7" fill="none"/><text x="500" y="875" class="small">CS → 3.3V</text>
  <path d="M466 895 H630 V785 H689" stroke="#222" stroke-width="7" fill="none"/><text x="500" y="925" class="small">SDO → GND</text>

  <!-- Right modules -->
  <rect class="card" x="1320" y="245" width="410" height="300" rx="12" fill="#4f608b" stroke="#34416c"/>
  <text x="1525" y="288" text-anchor="middle" class="ct">W25Q64（SPI2）</text>
  <circle cx="1345" cy="365" r="11" class="dotP"/><text x="1370" y="372" class="pin white">CS</text>
  <circle cx="1345" cy="415" r="11" class="dotY"/><text x="1370" y="422" class="pin white">CLK</text>
  <circle cx="1345" cy="465" r="11" class="dotBl"/><text x="1370" y="472" class="pin white">DO</text>
  <circle cx="1345" cy="515" r="11" class="dotG"/><text x="1370" y="522" class="pin white">DI</text>
  <text x="1525" y="532" text-anchor="middle" class="cn">VCC→3.3V，GND→GND</text>
  <path d="M1111 365 H1334" class="purple"/><text x="1220" y="351" text-anchor="middle" class="small">PB12 → CS</text>
  <path d="M1111 415 H1334" class="yellow"/><text x="1220" y="401" text-anchor="middle" class="small">PB13 → CLK</text>
  <path d="M1111 465 H1334" class="blue"/><text x="1220" y="451" text-anchor="middle" class="small">PB14 ← DO</text>
  <path d="M1111 515 H1334" class="green"/><text x="1220" y="501" text-anchor="middle" class="small">PB15 → DI</text>

  <rect class="card" x="1320" y="575" width="410" height="220" rx="12" fill="#4e7a50" stroke="#315b34"/>
  <text x="1525" y="618" text-anchor="middle" class="ct">DS1302</text>
  <circle cx="1345" cy="635" r="11" class="dotY"/><text x="1370" y="642" class="pin white">CLK</text>
  <circle cx="1345" cy="685" r="11" class="dotG"/><text x="1370" y="692" class="pin white">DAT</text>
  <circle cx="1345" cy="735" r="11" class="dotP"/><text x="1370" y="742" class="pin white">RST</text>
  <text x="1525" y="775" text-anchor="middle" class="cn">VCC→3.3V，GND→GND</text>
  <path d="M1111 615 H1200 V635 H1334" class="yellow"/><text x="1215" y="603" class="small">PA4 → CLK</text>
  <path d="M1111 665 H1230 V685 H1334" class="green"/><text x="1245" y="653" class="small">PA5 ↔ DAT</text>
  <path d="M1111 715 H1260 V735 H1334" class="purple"/><text x="1270" y="703" class="small">PA6 → RST</text>

  <rect class="card" x="1320" y="825" width="410" height="185" rx="12" fill="#2f7068" stroke="#1e514b"/>
  <text x="1525" y="868" text-anchor="middle" class="ct">JDY-16（9600波特率）</text>
  <circle cx="1345" cy="900" r="11" class="dotBl"/><text x="1370" y="907" class="pin white">RX</text>
  <circle cx="1345" cy="955" r="11" class="dotC"/><text x="1370" y="962" class="pin white">TX</text>
  <text x="1525" y="995" text-anchor="middle" class="cn">VCC→3.3V，GND→GND</text>
  <path d="M1111 835 H1210 V900 H1334" class="blue"/><text x="1220" y="823" class="small">PA2(TX) → RX</text>
  <path d="M1111 885 H1250 V955 H1334" class="cyan"/><text x="1260" y="873" class="small">PA3(RX) ← TX</text>

  <!-- Debug and rules -->
  <rect x="70" y="1040" width="805" height="255" rx="12" fill="#fff" stroke="#9ca7ad" stroke-width="3"/>
  <text x="100" y="1080" class="section">临时调试接口</text>
  <text x="100" y="1122" class="pin">ST-Link V2+</text>
  <text x="100" y="1155" class="note">SWDIO → PA13　　SWCLK → PA14　　GND → GND</text>
  <text x="100" y="1193" class="pin">UST-343A 串口（115200）</text>
  <text x="100" y="1226" class="note">TX → PA10　　RX → PA9　　GND → GND</text>
  <text x="100" y="1265" class="small" fill="#a2231d">两种调试器都不接VCC；电池开关保持供电。</text>

  <rect x="925" y="1040" width="805" height="255" rx="12" fill="#fff0e7" stroke="#bd5a31" stroke-width="3"/>
  <text x="955" y="1080" class="section" fill="#873416">接线检查顺序</text>
  <text x="955" y="1122" class="note">1. 断电后按模块逐根接线，不要一次插完再排错。</text>
  <text x="955" y="1158" class="note">2. 每个模块都检查 VCC=3.3V、GND连续、信号脚无短路。</text>
  <text x="955" y="1194" class="note">3. ADXL345的CS必须接3.3V，SDO必须接GND（地址0x53）。</text>
  <text x="955" y="1230" class="note">4. UART必须交叉：STM32 TX接模块RX，STM32 RX接模块TX。</text>
  <text x="955" y="1266" class="note">5. 上电后先看串口初始化信息，再固定导线。</text>

  <rect x="70" y="1320" width="1660" height="55" rx="8" fill="#ffe0dd" stroke="#b4322b" stroke-width="2"/>
  <text x="900" y="1356" text-anchor="middle" class="pin" fill="#8f1d18">出现模块发热、OLED不亮、串口全乱码或3.3V电压异常时立即断电，不要反复重启。</text>
</svg>
